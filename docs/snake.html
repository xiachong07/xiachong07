<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contribution Snake · xiachong07</title>
<style>
  /* ═══════════════════════════ 全局 ═══════════════════════════ */
  :root {
    --bg: #0d1117;
    --text: #c9d1d9;
    --border: #30363d;
    --cell-0: #161b22;
    --cell-1: #0e4429;
    --cell-2: #006d32;
    --cell-3: #26a641;
    --cell-4: #39d353;
    --tooltip-bg: #1c2128;
    --glow: rgba(88,166,255,0.3);
    --snake: #58a6ff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --text: #24292f;
      --border: #d0d7de;
      --cell-0: #ebedf0;
      --cell-1: #9be9a8;
      --cell-2: #40c463;
      --cell-3: #30a14e;
      --cell-4: #216e39;
      --tooltip-bg: #f6f8fa;
      --glow: rgba(9,105,218,0.2);
      --snake: #0969da;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 40px 20px;
  }
  h1 { font-size: 24px; margin-bottom: 8px; }
  h1 a { color: var(--snake); text-decoration: none; }
  .subtitle { font-size: 14px; color: #8b949e; margin-bottom: 24px; }

  /* ═══════════════════════════ 提示框 ═══════════════════════ */
  .tooltip {
    position: fixed; pointer-events: none; z-index: 100;
    background: var(--tooltip-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; font-size: 13px;
    opacity: 0; transform: translate(-50%, -130%);
    transition: opacity 0.15s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    white-space: nowrap; line-height: 1.6;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .date { color: #8b949e; font-size: 12px; }
  .tooltip .count { font-weight: 600; color: var(--snake); }
  .tooltip .repos { color: #8b949e; font-size: 12px; margin-top: 2px; }

  /* ═══════════════════════════ 网格容器 ═══════════════════════ */
  .grid-wrapper { position: relative; margin: 0 auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(53, 13px);
    grid-template-rows: repeat(7, 13px);
    gap: 3px; padding: 16px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--bg);
  }

  /* ═══════════════════════════ 单元格 ═══════════════════════ */
  .cell {
    width: 13px; height: 13px; border-radius: 3px;
    background: var(--cell-0); cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.2s ease;
    position: relative;
  }
  .cell.level-1 { background: var(--cell-1); }
  .cell.level-2 { background: var(--cell-2); }
  .cell.level-3 { background: var(--cell-3); }
  .cell.level-4 { background: var(--cell-4); }

  /* ── 浮动放大效果 ── */
  .cell.floating {
    transform: scale(var(--float-scale, 1.4));
    box-shadow: 0 0 8px var(--glow);
    z-index: 2;
  }

  /* ── 蛇轨迹 ── */
  .cell.snake-trail {
    box-shadow: inset 0 0 6px var(--snake), 0 0 8px var(--glow);
    transform: scale(1.15);
    transition: transform 0.3s ease, box-shadow 0.5s ease;
  }
  .cell.snake-head {
    background: var(--snake) !important;
    transform: scale(1.3);
    box-shadow: 0 0 14px var(--glow);
    border-radius: 5px;
  }

  /* ═══════════════════════════ 图例 ═══════════════════════════ */
  .legend {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; margin-top: 16px; font-size: 12px; color: #8b949e;
  }
  .legend .cell { width: 11px; height: 11px; cursor: default; }

  /* ═══════════════════════════ 加载状态 ═══════════════════════ */
  .loading { padding: 60px; color: #8b949e; font-size: 14px; }
  .error { padding: 40px; color: #f85149; font-size: 14px; }

  /* ═══════════════════════════ 响应式 ═══════════════════════ */
  @media (max-width: 840px) {
    .grid { gap: 2px; padding: 8px; }
    .grid { grid-template-columns: repeat(53, 9px); grid-template-rows: repeat(7, 9px); }
    .cell { width: 9px; height: 9px; border-radius: 2px; }
    .legend .cell { width: 8px; height: 8px; }
    h1 { font-size: 18px; }
  }
</style>
</head>
<body>

<h1>
  <a href="https://github.com/xiachong07" target="_blank">@xiachong07</a>
  · Contribution Snake
</h1>
<p class="subtitle">悬停方块查看贡献详情 · 光标周围方块浮起效果</p>

<div class="grid-wrapper">
  <div class="grid" id="grid"></div>
</div>

<div class="legend">
  <span>Less</span>
  <span class="cell level-0"></span>
  <span class="cell level-1"></span>
  <span class="cell level-2"></span>
  <span class="cell level-3"></span>
  <span class="cell level-4"></span>
  <span>More</span>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
// ═══════════════════════════════════════════════════════════════
//  数据层 · 从 JSON 文件加载真实贡献数据
// ═══════════════════════════════════════════════════════════════

let cells = [];           // { date, count, level, x, y }
let gridEl, tooltipEl;
const COLS = 53;
const ROWS = 7;

async function loadData() {
  try {
    const resp = await fetch('snake-data.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    return buildGrid(data.contributions);
  } catch (e) {
    // 后备：生成演示数据
    console.warn('无法加载真实数据，使用演示数据:', e);
    return buildDemoGrid();
  }
}

function buildGrid(contributions) {
  // contributions: [{ date, count, level }]
  const map = new Map(contributions.map(c => [c.date, c]));
  const today = new Date();
  // 从 53 周前的周日开始
  const start = new Date(today);
  start.setDate(start.getDate() - start.getDay() - 52 * 7);

  const grid = [];
  for (let col = 0; col < COLS; col++) {
    for (let row = 0; row < ROWS; row++) {
      const d = new Date(start);
      d.setDate(d.getDate() + col * 7 + row);
      const key = d.toISOString().split('T')[0];
      const info = map.get(key) || { count: 0, level: 0 };
      grid.push({ date: key, count: info.count, level: info.level || 0, x: col, y: row });
    }
  }
  return grid;
}

function buildDemoGrid() {
  const grid = [];
  const today = new Date();
  const start = new Date(today);
  start.setDate(start.getDate() - start.getDay() - 52 * 7);

  for (let col = 0; col < COLS; col++) {
    for (let row = 0; row < ROWS; row++) {
      const d = new Date(start);
      d.setDate(d.getDate() + col * 7 + row);
      const key = d.toISOString().split('T')[0];
      const past = (col * 7 + row) / (COLS * ROWS);
      // 后半部分有更多贡献
      const r = Math.random();
      let count = 0, level = 0;
      if (past > 0.6 && r < 0.5)      { count = Math.floor(r * 5) + 1; level = count > 3 ? 4 : count; }
      else if (past > 0.4 && r < 0.3) { count = Math.floor(r * 3) + 1; level = count; }
      else if (r < 0.1)               { count = 1; level = 1; }
      grid.push({ date: key, count, level, x: col, y: row });
    }
  }
  return grid;
}

// ═══════════════════════════════════════════════════════════════
//  渲染层 · 构建网格 DOM
// ═══════════════════════════════════════════════════════════════

function renderGrid(grid) {
  cells = grid;
  gridEl = document.getElementById('grid');
  gridEl.innerHTML = '';
  tooltipEl = document.getElementById('tooltip');

  grid.forEach((cell, idx) => {
    const el = document.createElement('div');
    el.className = `cell level-${cell.level}`;
    el.dataset.idx = idx;
    el.addEventListener('mouseenter', onCellEnter);
    el.addEventListener('mouseleave', onCellLeave);
    el.addEventListener('mousemove', onCellMove);
    gridEl.appendChild(el);
  });
}

// ═══════════════════════════════════════════════════════════════
//  交互层 · 悬浮提示 + 浮动效果
// ═══════════════════════════════════════════════════════════════

let activeCellIdx = -1;
let floatRadius = 2; // 浮动半径（格数）

function onCellEnter(e) {
  const idx = parseInt(e.target.dataset.idx);
  activeCellIdx = idx;
  showTooltip(idx, e);
  updateFloat(idx);
}

function onCellMove(e) {
  if (activeCellIdx >= 0) {
    moveTooltip(e);
    // 如果移动到相邻格子，更新浮动中心
    const idx = parseInt(e.target.dataset.idx);
    if (idx !== activeCellIdx) {
      clearFloat();
      activeCellIdx = idx;
      updateFloat(idx);
    }
  }
}

function onCellLeave() {
  activeCellIdx = -1;
  hideTooltip();
  clearFloat();
}

// ── 提示框 ─────────────────────────────────────────────────
function showTooltip(idx, e) {
  const cell = cells[idx];
  const d = new Date(cell.date + 'T00:00:00');
  const dateStr = d.toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'short' });

  tooltipEl.innerHTML = `
    <div class="date">${dateStr}</div>
    <div class="count">${cell.count} contribution${cell.count !== 1 ? 's' : ''}</div>
    <div class="repos">点击前往 GitHub 查看详情 →</div>
  `;
  tooltipEl.classList.add('visible');
  moveTooltip(e);
}

function moveTooltip(e) {
  tooltipEl.style.left = e.clientX + 'px';
  tooltipEl.style.top = e.clientY + 'px';
}

function hideTooltip() {
  tooltipEl.classList.remove('visible');
}

// ── 浮动放大效果 ────────────────────────────────────────────
function updateFloat(centerIdx) {
  const center = cells[centerIdx];
  const allEls = gridEl.querySelectorAll('.cell');

  allEls.forEach(el => {
    const idx = parseInt(el.dataset.idx);
    const cell = cells[idx];
    const dx = cell.x - center.x;
    const dy = cell.y - center.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist <= floatRadius + 0.5) {
      // 距离越近，放大越多（中心 1.6x → 边缘 1.1x）
      const scale = 1.6 - (dist / (floatRadius + 0.5)) * 0.5;
      el.style.setProperty('--float-scale', Math.max(1.05, scale));
      el.classList.add('floating');
    } else {
      el.classList.remove('floating');
    }
  });
}

function clearFloat() {
  gridEl.querySelectorAll('.cell.floating').forEach(el => {
    el.classList.remove('floating');
  });
}

// ═══════════════════════════════════════════════════════════════
//  动画层 · 贪吃蛇路径
// ═══════════════════════════════════════════════════════════════

function buildSnakePath() {
  // 蛇走 Z 字形路径，覆盖整个网格
  const path = [];
  for (let col = 0; col < COLS; col++) {
    if (col % 2 === 0) {
      for (let row = 0; row < ROWS; row++) path.push({ col, row });
    } else {
      for (let row = ROWS - 1; row >= 0; row--) path.push({ col, row });
    }
  }
  return path;
}

function animateSnake() {
  const path = buildSnakePath();
  let step = 0;
  const trailLength = 8;
  const allEls = gridEl.querySelectorAll('.cell');

  function getCellIndex(col, row) {
    return col * ROWS + row;
  }

  function tick() {
    // 清除所有高亮
    allEls.forEach(el => {
      el.classList.remove('snake-trail', 'snake-head');
    });

    // 当前蛇头位置
    const head = path[step % path.length];
    const headIdx = getCellIndex(head.col, head.row);

    // 绘制蛇身（尾巴）
    for (let t = 1; t <= trailLength; t++) {
      const prev = step - t;
      if (prev < 0) continue;
      const pos = path[prev % path.length];
      const idx = getCellIndex(pos.col, pos.row);
      allEls[idx]?.classList.add('snake-trail');
    }

    // 绘制蛇头
    allEls[headIdx]?.classList.add('snake-head');

    step++;
    setTimeout(tick, 120);
  }

  tick();
}

// ═══════════════════════════════════════════════════════════════
//  点击格子 → 跳转 GitHub 贡献详情
// ═══════════════════════════════════════════════════════════════

gridEl?.addEventListener('click', (e) => {
  if (!e.target.classList.contains('cell')) return;
  const idx = parseInt(e.target.dataset.idx);
  if (idx >= 0 && cells[idx].count > 0) {
    const d = cells[idx].date;
    window.open(`https://github.com/xiachong07?tab=overview&from=${d}&to=${d}`, '_blank');
  }
});

// ═══════════════════════════════════════════════════════════════
//  启动
// ═══════════════════════════════════════════════════════════════

(async function init() {
  const grid = await loadData();
  renderGrid(grid);
  animateSnake();
})();
</script>

</body>
</html>
