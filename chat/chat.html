<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat · xiachong07</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #c9d1d9; --text2: #8b949e; --accent: #58a6ff;
    --bubble-ai: #161b22; --bubble-user: #1f6feb22;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fff; --surface: #f6f8fa; --border: #d0d7de;
      --text: #24292f; --text2: #57606a; --accent: #0969da;
      --bubble-ai: #f6f8fa; --bubble-user: #ddf4ff;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column;
  }
  .header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface); display: flex; align-items: center; gap: 10px;
  }
  .header .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg,#7928ca,#ff0080);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .header h1 { font-size: 15px; font-weight: 600; }
  .header .sub { font-size: 11px; color: var(--text2); }
  .header .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #39d353; margin-left: auto;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .messages {
    flex:1; overflow-y:auto; padding: 16px 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg {
    max-width: 82%; padding: 10px 14px; border-radius: 14px;
    font-size: 13px; line-height: 1.55;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .msg.ai {
    align-self: flex-start; background: var(--bubble-ai);
    border: 1px solid var(--border); border-bottom-left-radius: 4px;
  }
  .msg.user {
    align-self: flex-end; background: var(--bubble-user);
    border: 1px solid var(--accent); border-bottom-right-radius: 4px;
  }
  .msg .label { font-size: 11px; color: var(--text2); margin-bottom: 3px; }
  .msg.ai .label { color: var(--accent); }
  .msg code {
    background: var(--border); padding: 1px 5px;
    border-radius: 3px; font-size: 12px;
  }
  .msg pre {
    background: var(--border); padding: 10px; border-radius: 6px;
    overflow-x: auto; font-size: 12px; margin: 6px 0;
  }
  .typing {
    align-self: flex-start; padding: 10px 14px;
    background: var(--bubble-ai); border: 1px solid var(--border);
    border-radius: 14px 14px 14px 4px; display: none;
  }
  .typing.active { display: block; }
  .typing span {
    display: inline-block; width: 5px; height: 5px;
    border-radius: 50%; background: var(--text2); margin: 0 2px;
    animation: bounce 1.4s infinite;
  }
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
  .input-area {
    padding: 14px 20px; border-top: 1px solid var(--border);
    background: var(--surface); display: flex; gap: 10px;
  }
  .input-area input {
    flex:1; padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 13px; outline: none;
  }
  .input-area input:focus { border-color: var(--accent); }
  .input-area button {
    padding: 10px 18px; border-radius: 8px; border: none;
    background: linear-gradient(135deg,#7928ca,#ff0080);
    color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .input-area button:disabled { opacity: .5; }
  .footer {
    text-align:center; padding:6px; font-size:11px; color: var(--text2);
  }
  .footer a { color: var(--accent); text-decoration: none; }
  @media (max-width:600px){ .msg{max-width:90%} }
</style>
</head>
<body>

<div class="header">
  <div class="avatar">🤖</div>
  <div>
    <h1>Chat with DeepSeek</h1>
    <div class="sub">@xiaochong07 · Ask about projects</div>
  </div>
  <div class="dot" title="Online"></div>
</div>

<div class="messages" id="messages">
  <div class="msg ai">
    <div class="label">DeepSeek</div>
    👋 Hi! I'm an AI assistant on <b>xiachong07</b>'s profile.<br/><br/>
    🎵 Ask about <b>BirdCLEF 2026</b> audio classification<br/>
    📊 Ask about <b>data science</b> projects<br/>
    💻 Ask about <b>Python, PyTorch</b> tech stack<br/><br/>
    How can I help you today?
  </div>
</div>

<div class="typing" id="typing"><span></span><span></span><span></span></div>

<div class="input-area">
  <input id="userInput" type="text" placeholder="Ask me anything..."
         autocomplete="off" onkeydown="if(event.key==='Enter')send()" />
  <button id="sendBtn" onclick="send()">Send</button>
</div>

<div class="footer">
  <a href="https://github.com/xiachong07" target="_blank">@xiachong07</a>
  · Powered by DeepSeek
</div>

<script>
// ── DeepSeek API 直连 ──
const API_KEY = 'sk-9056c123b8454d969c879efd3233cfd9';
const API_URL = 'https://api.deepseek.com/v1/chat/completions';

let isLoading = false;
let history = [];

function scrollBottom() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const label = role === 'ai' ? 'DeepSeek' : 'You';
  div.innerHTML = '<div class="label">' + label + '</div>' + text;
  document.getElementById('messages').appendChild(div);
  scrollBottom();
}

function renderMd(s) {
  return s
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\n/g, '<br>');
}

async function send() {
  const input = document.getElementById('userInput');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text || isLoading) return;

  input.value = '';
  input.disabled = true;
  btn.disabled = true;
  isLoading = true;

  addMsg('user', text);
  history.push({ role: 'user', content: text });

  const typing = document.getElementById('typing');
  typing.classList.add('active');
  scrollBottom();

  try {
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [
          { role: 'system', content: 'You are a friendly AI assistant on xiachong07\'s GitHub profile. You help visitors learn about his projects: BirdCLEF 2026 (audio classification), data science work, math modeling, Python/PyTorch stack. Keep replies concise and helpful. Reply in the same language as the user.' },
          ...history.slice(-10)
        ],
        max_tokens: 1024
      })
    });

    typing.classList.remove('active');

    if (!resp.ok) {
      const err = await resp.text();
      addMsg('ai', '⚠️ API error. Please try again later.<br><sub>' + err.slice(0, 100) + '</sub>');
      return;
    }

    const data = await resp.json();
    const reply = data.choices[0].message.content;
    history.push({ role: 'assistant', content: reply });
    addMsg('ai', renderMd(reply));
  } catch (e) {
    typing.classList.remove('active');
    addMsg('ai', '⚠️ Network error. Please check your connection and try again.');
    console.error(e);
  }

  input.disabled = false;
  btn.disabled = false;
  input.focus();
  isLoading = false;
}
</script>
</body>
</html>
